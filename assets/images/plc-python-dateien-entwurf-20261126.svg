<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" role="img" aria-labelledby="title-2 desc-2">
<title id="title-2">PLC_PY_COM: Dateien, AppPool und Aufräumen</title><desc id="desc-2">Diskussionsentwurf zur achten KonsoleLite-Projektmappe PLC_PY_COM. Zwei zentrale PLC-Einstiegsdateien werden einmal eingebunden und registrieren die modulspezifische DEF-Datei und beide IN-/OUT-MOD-Dateien. AppPool liefert die zugehörigen Dateien mit. Entfernt werden nur nicht mehr verwendete eigene Schnittstellenbindungen, niemals die ursprünglichen PLC-Deklarationen.</desc>
<defs><style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#203b43}.muted{fill:#526c71}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace;white-space:pre}.heading{font-weight:700}</style>
<marker id="gray-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#819b9b"/></marker>
<marker id="blue-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#287e9b"/></marker>
<marker id="brown-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a5663c"/></marker>
<marker id="green-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#557553"/></marker>
</defs><rect width="1680" height="1188" fill="#f6f8f4"/>
<text x="56" y="51" font-size="18" class="heading muted">CONSOLELITE · PLC / PYTHON</text>
<rect x="1242" y="25" width="382" height="40" rx="20" fill="#e5ede1" stroke="#b4c4a8" stroke-width="1.5"/>
<text x="1264" y="51" font-size="18" class="heading">ENTWURF · 26.11.2026 · 2/2</text>
<text x="56" y="111" font-size="42" class="heading">Ein Modul. Ein vollständiges Paket.</text>
<text x="56" y="154" font-size="23" class="muted">Dateien modular ablegen, zentral anbinden und beim Weitergeben gemeinsam verwalten.</text>
<rect x="56" y="182" width="1568" height="61" rx="10" fill="#e9efed" stroke="#c3d0ca" stroke-width="1.5"/>
<text x="78" y="220" font-size="21" class="">PLC_PY_COM ergänzt die sieben bestehenden KonsoleLite-Ordner. Python-Interfaces bleiben an ihrem bisherigen Ort.</text>
<rect x="56" y="270" width="690" height="687" rx="14" fill="#ffffff" stroke="#becdca" stroke-width="1.5"/>
<text x="80" y="311" font-size="19" class="heading muted">PROJEKTSTRUKTUR · HGM ALS BEISPIEL</text>
<text x="85" y="353" font-size="23" class="mono heading" style="fill:#203b43">KonsoleLite/</text>
<text x="85" y="380" font-size="23" class="mono" style="fill:#526c71">├─ CONFIG/</text>
<text x="85" y="407" font-size="23" class="mono" style="fill:#526c71">├─ CTRL/</text>
<text x="85" y="434" font-size="23" class="mono" style="fill:#526c71">├─ DATA/</text>
<text x="85" y="461" font-size="23" class="mono" style="fill:#526c71">├─ DOCS/</text>
<text x="85" y="488" font-size="23" class="mono" style="fill:#203b43">├─ MODULES/</text>
<text x="85" y="515" font-size="23" class="mono" style="fill:#203b43">│  └─ Hintergrundmagazin/</text>
<text x="85" y="542" font-size="23" class="mono" style="fill:#203b43">│     └─ interfaces/</text>
<rect x="75" y="545" width="647" height="30" rx="4" fill="#e5eddf" stroke="none" stroke-width="1.5"/>
<text x="85" y="569" font-size="23" class="mono heading" style="fill:#557553">│        └─ interface.py</text>
<text x="85" y="596" font-size="23" class="mono heading" style="fill:#a5663c">├─ PLC_PY_COM/</text>
<rect x="75" y="599" width="647" height="30" rx="4" fill="#e6f0f3" stroke="none" stroke-width="1.5"/>
<text x="85" y="623" font-size="23" class="mono heading" style="fill:#287e9b">│  ├─ PLC_PY_COM.DEF</text>
<rect x="75" y="626" width="647" height="30" rx="4" fill="#e6f0f3" stroke="none" stroke-width="1.5"/>
<text x="85" y="650" font-size="23" class="mono heading" style="fill:#287e9b">│  ├─ PLC_PY_COM.MOD</text>
<text x="85" y="677" font-size="23" class="mono" style="fill:#a5663c">│  ├─ PY_HGM.DEF</text>
<text x="85" y="704" font-size="23" class="mono" style="fill:#a5663c">│  ├─ PY_HGM_IN.MOD</text>
<text x="85" y="731" font-size="23" class="mono" style="fill:#a5663c">│  ├─ PY_HGM_OUT.MOD</text>
<text x="85" y="758" font-size="23" class="mono" style="fill:#a5663c">│  ├─ PY_CLAMPING.DEF</text>
<text x="85" y="785" font-size="23" class="mono" style="fill:#a5663c">│  ├─ PY_CLAMPING_IN.MOD</text>
<text x="85" y="812" font-size="23" class="mono" style="fill:#a5663c">│  └─ PY_CLAMPING_OUT.MOD</text>
<text x="85" y="839" font-size="23" class="mono" style="fill:#526c71">├─ SEQUENCE/</text>
<text x="85" y="866" font-size="23" class="mono" style="fill:#526c71">└─ UNITS/</text>
<text x="82" y="911" font-size="18" class="muted">Grün: Python bleibt · HGM = Hintergrundmagazin</text>
<text x="82" y="939" font-size="17" class="muted">Blau: zentrale Einstiege · Braun: neue PLC-Beispieldateien</text>
<rect x="786" y="270" width="838" height="183" rx="14" fill="#e6f0f3" stroke="#a4c3cc" stroke-width="1.5"/>
<text x="810" y="307" font-size="25" class="heading">01   PLC-Projekt einmal anbinden</text>
<text x="810" y="346" font-size="22" class="mono">DEV_DATA     →  PLC_PY_COM.DEF</text>
<text x="810" y="379" font-size="22" class="mono">SOURCE_DATA  →  PLC_PY_COM.MOD</text>
<text x="810" y="412" font-size="21" class="">Zyklusanfang: IN-Aufruf · Zyklusende: OUT-Aufruf</text>
<text x="810" y="440" font-size="18" class="muted">Weitere Module danach in beiden zentralen Dateien registrieren.</text>
<rect x="786" y="477" width="838" height="249" rx="14" fill="#f1ede2" stroke="#c8bda0" stroke-width="1.5"/>
<text x="810" y="515" font-size="25" class="heading">02   AppPool nimmt die PLC-Dateien mit</text>
<text x="810" y="552" font-size="22" class="">Modulpaket: QML / Controller / Python-Interface</text>
<text x="810" y="586" font-size="21" class="mono">+ PLC-Dateien: DEF sowie IN.MOD und OUT.MOD</text>
<path d="M1202 599V623" fill="none" stroke="#819b9b" stroke-width="2.5" marker-end="url(#gray-2)"/>
<text x="810" y="652" font-size="21" class="heading">Import: ablegen → Symbole und Typen prüfen → registrieren</text>
<text x="810" y="684" font-size="20" class="">Die Konsole pflegt beide zentralen Einträge ohne Duplikate.</text>
<text x="810" y="710" font-size="18" class="muted">PLC-Übersetzung und Aktivierung separat festlegen.</text>
<rect x="786" y="750" width="838" height="207" rx="14" fill="#e5eddf" stroke="#b4c5a1" stroke-width="1.5"/>
<text x="810" y="788" font-size="24" class="heading">03   Ungenutzte Verbindungen sauber entfernen</text>
<text x="810" y="826" font-size="21" class="">Python-Binding + PY-DEF-Eintrag + IN-/OUT-Mapping entfernen.</text>
<text x="810" y="860" font-size="20" class="">Vorher Referenzen prüfen und betroffene Änderungen bestätigen.</text>
<text x="810" y="895" font-size="20" class="">Ganzes Modul entfernt? Auch zentrale Registrierungen bereinigen.</text>
<text x="810" y="932" font-size="20" class="heading">Original-PLC-Deklarationen und fremde Inhalte bleiben erhalten.</text>
<rect x="56" y="986" width="1568" height="143" rx="14" fill="#ffffff" stroke="#b6c9c0" stroke-width="1.5"/>
<text x="80" y="1022" font-size="21" class="heading">GEMEINSAM FESTLEGEN · bevor der Generator umgesetzt wird</text>
<text x="80" y="1055" font-size="20" class="">Eindeutige Namen und Typen · PLC-Aufrufreihenfolge · einmalige Umstellung vorhandener Python-Bindings</text>
<text x="80" y="1087" font-size="20" class="">Schreibzuständigkeit: PLC-Logik, Bedienung und Hintergrunddienste abstimmen · keine Signal-Richtungswahl</text>
<text x="80" y="1115" font-size="19" class="muted">Vollständige Datenabbilder und Taktung · Wiederverbindung · schreibbare PLC-Ziele · Konfliktprüfung beim Import</text>
<text x="56" y="1163" font-size="18" class="heading muted">KONZEPT ZUR BESPRECHUNG · kein PLC-Programm wurde geändert, übersetzt oder auf eine Maschine übertragen.</text>
<text x="56" y="1180" font-size="16" class="muted">Ziel: PLC-Integrator und Python-Entwickler können dieselbe Verbindung vom Originalsymbol bis zur Bedienung verfolgen.</text>
</svg>
