<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" role="img" aria-labelledby="title-1 desc-1">
<title id="title-1">PLC und Python: eine sichtbare Schnittstelle</title><desc id="desc-1">Diskussionsentwurf: bestehende PLC-Symbole auswählen und je Modul Python-Bindings, neue PY-Definitionen sowie getrennte Lese- und Schreib-MOD-Dateien erzeugen. Lesen und Schreiben sind getrennte Datenwege. INPUT, Python-Verarbeitung und OUTPUT bilden den fachlichen Durchlauf; seine Synchronisierung und die zyklische Ausgangsübertragung werden noch abgestimmt.</desc>
<defs><style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#203b43}.muted{fill:#526c71}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}.heading{font-weight:700}</style>
<marker id="gray-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#819b9b"/></marker>
<marker id="blue-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#287e9b"/></marker>
<marker id="brown-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a5663c"/></marker>
<marker id="green-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#557553"/></marker>
</defs><rect width="1680" height="1188" fill="#f6f8f4"/>
<text x="56" y="51" font-size="18" class="heading muted">CONSOLELITE · PLC / PYTHON</text>
<rect x="1242" y="25" width="382" height="40" rx="20" fill="#e5ede1" stroke="#b4c4a8" stroke-width="1.5"/>
<text x="1264" y="51" font-size="18" class="heading">ENTWURF · 26.11.2026 · 1/2</text>
<text x="56" y="111" font-size="42" class="heading">Lesen. Verarbeiten. Zurückschreiben.</text>
<text x="56" y="154" font-size="23" class="muted">Python verwendet PY-Schnittstellensymbole. Im PLC-Projekt wird jede Verbindung sichtbar.</text>
<rect x="56" y="182" width="1568" height="61" rx="10" fill="#e9efed" stroke="#c3d0ca" stroke-width="1.5"/>
<text x="78" y="220" font-size="22" class="">HEUTE: direkte PLC-Bindung.    ZIEL: Originalsymbol ↔ PLC-Mapping ↔ PY-Symbole ↔ Python / QML.</text>
<text x="56" y="283" font-size="25" class="heading">01   Auswahl bleibt vertraut</text>
<rect x="56" y="305" width="400" height="116" rx="14" fill="#ffffff" stroke="#becdca" stroke-width="1.5"/>
<rect x="510" y="305" width="680" height="116" rx="14" fill="#e5eee7" stroke="#9bb5a3" stroke-width="1.5"/>
<rect x="1244" y="305" width="380" height="116" rx="14" fill="#f0ede2" stroke="#c8bda0" stroke-width="1.5"/>
<text x="78" y="338" font-size="21" class="heading">DEV_DATA / bestehende DEF</text>
<text x="78" y="373" font-size="27" class="mono heading">WG_Speed</text>
<text x="78" y="402" font-size="17" class="muted">Originaldeklaration bleibt erhalten.</text>
<path d="M466 363H500" fill="none" stroke="#819b9b" stroke-width="2.5" marker-end="url(#gray-1)"/>
<text x="532" y="338" font-size="23" class="heading">Interface Editor · Modul auswählen</text>
<text x="532" y="373" font-size="27" class="mono heading">WG_Speed  →  WG_PY_Speed …</text>
<text x="532" y="402" font-size="18" class="muted">Datentyp aus DEF übernehmen · keine Richtungswahl</text>
<text x="1266" y="338" font-size="22" class="heading">PLC-Querverweis</text>
<text x="1266" y="373" font-size="21" class="mono">WG_Speed suchen</text>
<text x="1266" y="402" font-size="20" class="mono">→ PY_HGM_IN / OUT finden</text>
<text x="56" y="466" font-size="25" class="heading">02   Pro Modul: Python + DEF + zwei MOD-Dateien</text>
<rect x="56" y="489" width="484" height="153" rx="14" fill="#edf0eb" stroke="#a9b9a5" stroke-width="1.5"/>
<rect x="598" y="489" width="484" height="153" rx="14" fill="#e4f0f3" stroke="#a4c3cc" stroke-width="1.5"/>
<rect x="1140" y="489" width="484" height="153" rx="14" fill="#f4eadd" stroke="#cdb99c" stroke-width="1.5"/>
<text x="78" y="521" font-size="16" class="heading muted">PYTHON · BESTEHENDER ABLAGEORT</text>
<text x="78" y="561" font-size="29" class="mono heading">&lt;Gruppe&gt;.py</text>
<text x="78" y="597" font-size="20" class="">Eine Bindung für Anzeige und Bedienung.</text>
<text x="78" y="624" font-size="17" class="muted">Liest Eingangswerte, verarbeitet und liefert Ausgangswerte.</text>
<text x="620" y="521" font-size="16" class="heading muted">NEU · PLC-DEFINITIONEN</text>
<text x="620" y="561" font-size="29" class="mono heading">PY_HGM.DEF</text>
<text x="620" y="597" font-size="19" class="">Typisierte PY-Variablen für beide Mappingwege</text>
<text x="620" y="624" font-size="18" class="muted">Synchronisierung der Übergabe noch festzulegen.</text>
<text x="1162" y="521" font-size="16" class="heading muted">NEU · PLC-ZUORDNUNG</text>
<text x="1162" y="558" font-size="25" class="mono heading">PY_HGM_IN.MOD</text>
<text x="1162" y="588" font-size="25" class="mono heading">PY_HGM_OUT.MOD</text>
<text x="1162" y="617" font-size="17" class="">Lesen und Schreiben getrennt nachvollziehen.</text>
<text x="56" y="688" font-size="25" class="heading">03   INPUT → Python-Verarbeitung → OUTPUT</text>
<text x="56" y="731" font-size="20" class="heading" style="fill:#287e9b">LESEN · alle gebundenen PLC-Variablen in das Eingangsabbild</text>
<rect x="56" y="749" width="356" height="91" rx="10" fill="#e8f1f3" stroke="#b0c6cc" stroke-width="1.5"/>
<text x="75" y="783" font-size="21" class="heading">PLC-Originalwert</text>
<text x="75" y="818" font-size="18" class="muted">WG_Speed = 60</text>
<rect x="460" y="749" width="356" height="91" rx="10" fill="#e8f1f3" stroke="#b0c6cc" stroke-width="1.5"/>
<text x="479" y="783" font-size="21" class="heading">INPUT.MOD liest</text>
<text x="479" y="818" font-size="18" class="muted">Original → PY-Variable</text>
<rect x="864" y="749" width="356" height="91" rx="10" fill="#e8f1f3" stroke="#b0c6cc" stroke-width="1.5"/>
<text x="883" y="783" font-size="21" class="heading">PY-Wert im Modell</text>
<text x="883" y="818" font-size="18" class="muted">WG_PY_Speed = 60</text>
<rect x="1268" y="749" width="356" height="91" rx="10" fill="#e8f1f3" stroke="#b0c6cc" stroke-width="1.5"/>
<text x="1287" y="783" font-size="21" class="heading">Python / QML</text>
<text x="1287" y="818" font-size="18" class="muted">Slider zeigt 60</text>
<path d="M418 793H449" fill="none" stroke="#287e9b" stroke-width="3" marker-end="url(#blue-1)"/>
<path d="M822 793H853" fill="none" stroke="#287e9b" stroke-width="3" marker-end="url(#blue-1)"/>
<path d="M1226 793H1257" fill="none" stroke="#287e9b" stroke-width="3" marker-end="url(#blue-1)"/>
<text x="56" y="883" font-size="20" class="heading" style="fill:#a5663c">ZURÜCKSCHREIBEN · alle gebundenen PLC-Variablen · auch unveränderte Werte</text>
<rect x="56" y="901" width="356" height="91" rx="10" fill="#f5ecdf" stroke="#cebba1" stroke-width="1.5"/>
<text x="75" y="935" font-size="21" class="heading">PLC-Originalwert</text>
<text x="75" y="970" font-size="17" class="muted">aktuellen PY-Wert übernehmen</text>
<rect x="460" y="901" width="356" height="91" rx="10" fill="#f5ecdf" stroke="#cebba1" stroke-width="1.5"/>
<text x="479" y="935" font-size="21" class="heading">OUTPUT.MOD schreibt</text>
<text x="479" y="970" font-size="17" class="muted">PY-Variable → Original</text>
<rect x="864" y="901" width="356" height="91" rx="10" fill="#f5ecdf" stroke="#cebba1" stroke-width="1.5"/>
<text x="883" y="935" font-size="21" class="heading">PY-Wert nach Verarbeitung</text>
<text x="883" y="970" font-size="17" class="muted">WG_PY_Speed = 80</text>
<rect x="1268" y="901" width="356" height="91" rx="10" fill="#f5ecdf" stroke="#cebba1" stroke-width="1.5"/>
<text x="1287" y="935" font-size="21" class="heading">Python-Logik / QML</text>
<text x="1287" y="970" font-size="17" class="muted">verarbeitet / Slider setzt 80</text>
<path d="M449 945H418" fill="none" stroke="#a5663c" stroke-width="3" marker-end="url(#brown-1)"/>
<path d="M853 945H822" fill="none" stroke="#a5663c" stroke-width="3" marker-end="url(#brown-1)"/>
<path d="M1257 945H1226" fill="none" stroke="#a5663c" stroke-width="3" marker-end="url(#brown-1)"/>
<rect x="56" y="1041" width="1568" height="78" rx="10" fill="#e5eddf" stroke="#b4c5a1" stroke-width="1.5"/>
<text x="78" y="1073" font-size="21" class="heading">Jede gebundene PLC-Variable: lesen → Python-Logik → zurückschreiben. Keine IN-/OUT-Auswahl.</text>
<text x="78" y="1102" font-size="19" class="">Vollständiges Mapping in beide Richtungen, auch bei unverändertem Wert. Die technische Übergabe bleibt abzustimmen.</text>
<text x="56" y="1157" font-size="17" class="muted">PLC und Python besitzen bisher keinen gemeinsamen Takt. Konsistente Ein-/Ausgangsabbilder und Übergabe müssen abgestimmt werden.</text>
<text x="56" y="1180" font-size="16" class="muted">Symbolnamen sind Beispiele, keine ausführbare PLC-Syntax. Neue DEF-/MOD-Erzeugung und der dargestellte Datenaustausch sind noch nicht implementiert.</text>
</svg>
